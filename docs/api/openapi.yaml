openapi: 3.0.3
info:
  title: EQUHUB API
  description: Полная спецификация API для платформы EQUHUB
  version: 1.0.0

servers:
  - url: http://localhost:80/api
    description: Local development

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /auth/register:
    post:
      summary: Регистрация пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: Успешная регистрация
        '400':
          description: Ошибка валидации

  /auth/login:
    post:
      summary: Вход пользователя
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }

  /auth/logout:
    post:
      summary: Выход пользователя
      tags: [Auth]
      security: [bearerAuth]
      responses:
        '200':
          description: Успешный выход

  /auth/refresh:
    post:
      summary: Обновление токена
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Токен обновлён

  /users:
    get:
      summary: Получение списка пользователей
      tags: [Users]
      security: [bearerAuth]
      responses:
        '200':
          description: Список пользователей

  /users/{id}:
    get:
      summary: Получение профиля пользователя
      tags: [Users]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Профиль пользователя
    patch:
      summary: Обновление профиля
      tags: [Users]
      security: [bearerAuth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Профиль обновлён

  /feed:
    get:
      summary: Получение ленты публикаций
      tags: [Feed]
      security: [bearerAuth]
      responses:
        '200':
          description: Лента публикаций

  /posts:
    post:
      summary: Создание публикации
      tags: [Feed]
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                mediaUrls: { type: array, items: { type: string } }
      responses:
        '201':
          description: Публикация создана

  /posts/{id}:
    patch:
      summary: Обновление публикации
      tags: [Feed]
      security: [bearerAuth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Публикация обновлена
    delete:
      summary: Удаление публикации
      tags: [Feed]
      security: [bearerAuth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Публикация удалена

  /chats:
    get:
      summary: Получение списка чатов
      tags: [Chat]
      security: [bearerAuth]
      responses:
        '200':
          description: Список чатов

  /messages/{chatId}:
    get:
      summary: Получение сообщений чата
      tags: [Chat]
      security: [bearerAuth]
      parameters:
        - name: chatId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Сообщения чата

  /ads:
    get:
      summary: Получение объявлений
      tags: [Marketplace]
      responses:
        '200':
          description: Список объявлений
    post:
      summary: Создание объявления
      tags: [Marketplace]
      security: [bearerAuth]
      responses:
        '201':
          description: Объявление создано

  /ads/{id}:
    patch:
      summary: Обновление объявления
      tags: [Marketplace]
      security: [bearerAuth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Объявление обновлено
    delete:
      summary: Удаление объявления
      tags: [Marketplace]
      security: [bearerAuth]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Объявление удалено

  /jobs:
    get:
      summary: Получение вакансий
      tags: [Jobs]
      responses:
        '200':
          description: Список вакансий
    post:
      summary: Создание вакансии
      tags: [Jobs]
      security: [bearerAuth]
      responses:
        '201':
          description: Вакансия создана

  /resumes:
    get:
      summary: Получение резюме
      tags: [Jobs]
      security: [bearerAuth]
      responses:
        '200':
          description: Список резюме
    post:
      summary: Создание резюме
      tags: [Jobs]
      security: [bearerAuth]
      responses:
        '201':
          description: Резюме создано

  /ai/chat:
    post:
      summary: AI чат
      tags: [AI]
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message: { type: string }
      responses:
        '200':
          description: Ответ AI

  /ai/image:
    post:
      summary: Генерация изображения
      tags: [AI]
      security: [bearerAuth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt: { type: string }
      responses:
        '200':
          description: Сгенерированное изображение

  /ai/analyze:
    post:
      summary: AI анализ объявления
      tags: [AI]
      security: [bearerAuth]
      responses:
        '200':
          description: Результат анализа
